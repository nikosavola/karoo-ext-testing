name: Publish
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
permissions: {}
jobs:
  github-packages:
    name: GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup
      - name: Lint and test
        run: ./gradlew lintAll test --no-daemon
      # The tag is the version, the same one JitPack builds from it, so both feeds match.
      - name: Publish
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -PVERSION_NAME="$GITHUB_REF_NAME" --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
