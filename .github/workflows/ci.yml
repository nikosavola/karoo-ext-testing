name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.1.0'
      - name: Lint, build and test
        env:
          DOC_REF: ${{ github.sha }}
        run: ./gradlew lintAll build test selfTest :dokkaGeneratePublicationHtml -PdocumentationRef="$DOC_REF" --no-daemon
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: testing/build/reports/coverage/test/debug/report.xml,robolectric/build/reports/coverage/test/debug/report.xml,appstore/build/reports/coverage/test/debug/report.xml
          disable_search: true
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: testing/build/test-results/testDebugUnitTest/TEST-*.xml,robolectric/build/test-results/testDebugUnitTest/TEST-*.xml,appstore/build/test-results/testDebugUnitTest/TEST-*.xml
          disable_search: true
          fail_ci_if_error: false
      # Same publications as a release, into a scratch directory, so breakage shows before a tag.
      - name: Rehearse publishing
        run: >-
          ./gradlew publishToMavenLocal publishAllPublicationsToGitHubPackagesRepository -PgithubPackagesUrl="file://$RUNNER_TEMP/maven" --no-daemon
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            */build/reports/
            build/dokka/html
