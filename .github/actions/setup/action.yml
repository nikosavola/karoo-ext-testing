name: Set up toolchain
description: JDK 21 with the Gradle cache and the Android SDK packages the build needs.
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: temurin
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'platforms;android-37.0 build-tools;36.1.0'
